<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="84" viewBox="0 0 1000 84" role="img"><style>@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#a78bfa" stop-opacity=".0"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></linearGradient><linearGradient id="w" x1="0" x2="1"><stop offset="0" stop-color="#a78bfa" stop-opacity=".22"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></linearGradient></defs><rect width="1000" height="84" fill="#07060b"/><rect width="1000" height="84" fill="url(#w)"/><text x="30" y="44" font-family="Georgia,'Times New Roman',serif" font-size="40" fill="#fff">Five career tracks</text><text x="32" y="68" font-family="SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace" font-size="12.5" fill="#a78bfa">One foundation in data, five directions</text><rect x="0" y="80" width="1000" height="2" fill="url(#g)" opacity=".5"/><rect x="-200" y="79" width="200" height="4" fill="url(#g)"><animate attributeName="x" values="-200;1000" dur="4s" repeatCount="indefinite"/></rect></svg>